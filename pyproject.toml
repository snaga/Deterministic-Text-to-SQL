[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deterministic-text-to-sql"
version = "0.1.0"
description = "Deterministic Text-to-SQL Engine combining TypeSafe Jev and sqlglot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Satoshi Nagayasu" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlglot>=25.0.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-mock",
    "respx",
    "ruff",
    "mypy",
    "duckdb",
]

[project.scripts]
deterministic-text-to-sql = "deterministic_text_to_sql.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deterministic_text_to_sql"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["deterministic_text_to_sql"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "networkx",
    "networkx.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

